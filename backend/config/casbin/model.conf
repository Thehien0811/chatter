[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (g(r.sub, p.sub) || r.sub == p.sub) && keyMatch2(r.obj, p.obj) && r.act == p.act

p, user, /api/v1/profile, GET
p, user, /api/v1/users/:id, GET
p, user, /api/v1/users/:id, PATCH
p, admin, /api/v1/admin/*, GET
p, admin, /api/v1/admin/*, POST
p, admin, /api/v1/admin/*, PATCH
p, admin, /api/v1/admin/*, DELETE
