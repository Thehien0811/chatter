syntax = "proto3";

package chatter.v1;

option go_package = "github.com/thehien0811/chatter/proto;proto";

// ChatService owns persisted chat data. SendMessage commits before publishing
// recipient events to Redis channels named chat:user:<user_id>.
service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendImageMessage(SendImageMessageRequest) returns (SendImageMessageResponse);
  rpc GetMediaObject(GetMediaObjectRequest) returns (GetMediaObjectResponse);
  rpc GetOrCreateDirectConversation(GetOrCreateDirectConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc ListUnreadMessages(ListUnreadMessagesRequest) returns (ListUnreadMessagesResponse);
  rpc MarkDelivered(MarkDeliveredRequest) returns (MarkDeliveredResponse);
}

message SendMessageRequest { string conversation_id = 1; string sender_id = 2; string body = 3; }
message SendMessageResponse { string message_id = 1; bool success = 2; }
message SendImageMessageRequest {
  string conversation_id = 1;
  string sender_id = 2;
  string media_id = 3;
  string storage_key = 4;
  string media_type = 5;
  int64 byte_size = 6;
}
message SendImageMessageResponse { Message message = 1; }
message GetMediaObjectRequest { string media_id = 1; string user_id = 2; }
message GetMediaObjectResponse {
  string storage_key = 1;
  string media_type = 2;
  int64 byte_size = 3;
}
message GetOrCreateDirectConversationRequest { string user_id = 1; string recipient_id = 2; }
message ListConversationsRequest { string user_id = 1; }
message ListConversationsResponse { repeated Conversation conversations = 1; }
message Conversation {
  string id = 1;
  string title = 2;
  string participant_id = 3;
  string participant_username = 4;
  string participant_display_name = 5;
  string participant_presence = 6;
  string last_message_body = 7;
  string last_message_sender_id = 8;
  string updated_at = 9;
  int32 unread_count = 10;
  string last_message_id = 11;
}
message ListMessagesRequest { string conversation_id = 1; int32 limit = 2; string user_id = 3; }
message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string body = 4;
  string created_at = 5;
  repeated MessageAttachment attachments = 6;
}
message MessageAttachment {
  string id = 1;
  string media_type = 2;
  int64 byte_size = 3;
  string url = 4;
}
message ListMessagesResponse { repeated Message messages = 1; }
message ListUnreadMessagesRequest { string user_id = 1; int32 limit = 2; }
message UnreadMessage {
  string message_id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string body = 4;
  string created_at = 5;
}
message ListUnreadMessagesResponse { repeated UnreadMessage messages = 1; }
message MarkDeliveredRequest { string user_id = 1; string message_id = 2; }
message MarkDeliveredResponse { bool success = 1; }
